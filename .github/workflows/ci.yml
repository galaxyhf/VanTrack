name: Validate VanTrack
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://unused:unused@localhost/unused
      DATABASE_URL_UNPOOLED: postgresql://unused:unused@localhost/unused
      JWT_SECRET: ci-only-secret-at-least-forty-characters-long-never-production
      WEB_ORIGIN: http://localhost:3000
      SEED_DEMO: 'true'
      DEMO_PASSWORD: ci-demo-password-2026
      SIMULATOR_ENABLED: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Neon e E2E (branch exclusiva)
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          TEST_DATABASE_URL_UNPOOLED: ${{ secrets.TEST_DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ] || [ -z "$TEST_DATABASE_URL_UNPOOLED" ]; then
            echo "Neon/E2E não executados: configure os secrets de uma branch exclusiva."
            exit 0
          fi
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
          DATABASE_URL="$TEST_DATABASE_URL" node scripts/smoke-api-build.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
