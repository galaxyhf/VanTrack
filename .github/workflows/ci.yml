name: Validate VanTrack
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_MODE: embedded
      DATABASE_DATA_DIR: ${{ github.workspace }}/.data/ci
      DATABASE_URL: postgresql://unused:unused@localhost/unused
      DATABASE_URL_UNPOOLED: postgresql://unused:unused@localhost/unused
      JWT_SECRET: ci-only-secret-at-least-forty-characters-long-never-production
      WEB_ORIGIN: http://localhost:3000
      SEED_DEMO: 'true'
      DEMO_PASSWORD: ci-demo-password-2026
      SIMULATOR_ENABLED: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm build
      - run: node scripts/smoke-api-build.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
